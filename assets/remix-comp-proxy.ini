; remix-comp-proxy configuration (d3d9.dll proxy)
; Adapted from xoxor4d/remix-comp-base by kim2091 for Vibe Reverse Engineering

[Remix]
Enabled=1
DLLName=d3d9_remix.dll

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
[FFP]
Enabled=1
AlbedoStage=0

; ============================================================
; Engine culling (Timeline / Caesar engine runtime patches)
;
; DisableObjectCulling:   every model and character is drawn whole, at the finest LOD,
;                         regardless of view (also turns off projected shadows).
; DisableBackfaceCulling: both sides of every face are submitted.
; DisablePortalCulling:   neighbouring rooms are entered through the full viewport instead
;                         of the on-screen portal outline, and portal range limits are ignored.
; ============================================================
[Culling]
DisableObjectCulling=1
DisableBackfaceCulling=1
DisablePortalCulling=1

; ============================================================
; Engine lights -> D3D9 fixed-function lights (Remix converts them)
;
; IntensityScale:     multiplies every light's colour (tune brightness here).
; UnattenuatedRange:  D3D range for lights the engine does not fade with distance.
; ============================================================
[Lights]
Enabled=1
IntensityScale=1.0
UnattenuatedRange=5000

; ============================================================
; Path B: draw the engine's own model-space meshes (rigid models)
;
; Rigid models are drawn from the engine's model-space mesh with their world
; matrix (stable meshes for Remix asset replacement, real normals).
; Characters=1 draws characters from their bind-pose mesh with one joint matrix
; per vertex (FFP indexed vertex blending). Particles and sprites stay screen-space.
; Needs [Culling] DisableObjectCulling=1: models on the engine's clip paths
; never reach the hooked draw and stay on the screen-space path.
; ============================================================
[PathB]
Enabled=1
Characters=1

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
; ============================================================
[Skinning]
Enabled=0

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=1
DelayMs=60000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures
